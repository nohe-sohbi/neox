# Production-shaped stack: an nginx container serves the built frontend and
# proxies /api to the backend over the internal network. Only the frontend
# publishes a port — put your TLS terminator (Dokploy, Traefik, Caddy…) in
# front of it.
#
# For hot-reload development, run the two dev servers directly instead:
# see "Lancer en local (sans Docker)" in the README.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - "TMDB_API_KEY=${TMDB_API_KEY:?TMDB_API_KEY is required — free key at https://www.themoviedb.org/settings/api}"
      - TMDB_READ_TOKEN=${TMDB_READ_TOKEN:-}
      - TMDB_REGION=${TMDB_REGION:-FR}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-fr-FR}
      # No default on purpose: the API refuses to boot in production without
      # this, and a shared placeholder would be as good as no secret at all.
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — generate one with `openssl rand -hex 32`}"
      - DATA_DIR=/data
    volumes:
      # Persist accounts + libraries + the cache snapshot across redeploys.
      - neox-data:/data
    # Not published: the API is only reachable through the frontend proxy.
    expose:
      - "3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./project
      dockerfile: Dockerfile
      # Vite bakes these into the bundle at build time, so they are build args
      # rather than runtime env. Empty VITE_API_URL = same-origin /api.
      args:
        VITE_API_URL: ""
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_PLAUSIBLE_DOMAIN: ${VITE_PLAUSIBLE_DOMAIN:-}
        VITE_PLAUSIBLE_SRC: ${VITE_PLAUSIBLE_SRC:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      # nginx resolves its upstream once, at startup: if `backend` isn't
      # answering yet, it exits instead of serving. Waiting for the healthcheck
      # (not just for the container to exist) is what makes `up` deterministic.
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neox-data:
