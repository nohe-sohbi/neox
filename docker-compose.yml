services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    command: node server.js
    environment:
      - RESOLVER_API_KEY=${RESOLVER_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./project
      dockerfile: Dockerfile
    volumes:
      - ./project:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    command: npm run dev -- --host
    environment:
      - VITE_API_URL=http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped
