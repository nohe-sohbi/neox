# NEOX: static SPA shell + same-origin API proxy.
#
# Serving the API under the same host as the app means the browser never makes a
# cross-origin call: no CORS preflights, no API URL baked into the bundle, and
# one public port to expose behind TLS.

upstream neox_api {
    server backend:3001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are library JSON imports; the API caps them at 1mb.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── API ────────────────────────────────────────────────────
    # `^~`: the trailing-slash redirect below is a regex location, and a regex
    # match outranks a plain prefix. Without this, /api/anything/ would be
    # answered with a 301 instead of being proxied.
    location ^~ /api/ {
        proxy_pass http://neox_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API trusts one proxy hop and rate-limits per client IP, so this
        # header is what keeps the limiter from seeing every request as one user.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Static assets ──────────────────────────────────────────
    # Vite emits content-hashed filenames, so these can never go stale.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── One URL per page ───────────────────────────────────────
    # /movies and /movies/ both answered 200, which is the same page at two
    # addresses. 301 rather than 404 so whatever the slashed form accumulated
    # moves to the canonical one instead of being dropped.
    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    # The shell, the service worker and the manifest must be revalidated every
    # time; caching them would keep handing out the previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    # Exact match, so it is reached by the error_page redirect below and never
    # by a request for /404.html itself.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # ── SPA routes ─────────────────────────────────────────────
    # Each route has its own prerendered shell — /movies is served from
    # movies.html — carrying that route's title, description, canonical and
    # robots directive. Without the `$uri.html` lookup every URL would get
    # index.html, i.e. the home page's canonical, which reads to a crawler as
    # "this page is a duplicate of /". The bundle boots and React takes over
    # from there, exactly as before.
    #
    # no-cache on the shells for the same reason index.html has it: they name
    # content-hashed assets, and a cached shell keeps handing out the previous
    # deploy. They revalidate with an ETag, so it costs a 304, not a download.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }

    # No route whitelist to keep in sync: the shells the build emitted *are* the
    # list of URLs that answer. A route added to src/lib/routes.ts starts being
    # served the moment its shell exists, and anything with no shell is not a
    # page here — which is a 404, not a redirect to the home page.
    #
    # The 404 shell boots the same bundle, the router renders the not-found view,
    # and `error_page` leaves the status alone: it is a 404 the whole way down.
    error_page 404 /404.html;
}
