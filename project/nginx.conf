# NEOX: static SPA shell + same-origin API proxy.
#
# Serving the API under the same host as the app means the browser never makes a
# cross-origin call: no CORS preflights, no API URL baked into the bundle, and
# one public port to expose behind TLS.

upstream neox_api {
    server backend:3001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are library JSON imports; the API caps them at 1mb.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── API ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://neox_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API trusts one proxy hop and rate-limits per client IP, so this
        # header is what keeps the limiter from seeing every request as one user.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Static assets ──────────────────────────────────────────
    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The shell, the service worker and the manifest must be revalidated every
    # time; caching them would keep handing out the previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # ── SPA routes ─────────────────────────────────────────────
    # /movies, /search, /?watch=movie-550 … are all client-rendered.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
